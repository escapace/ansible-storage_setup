---
- name: reset input rejection result
  ansible.builtin.set_fact:
    storage_setup_input_rejected: false

- name: exercise invalid storage configuration
  block:
    - name: apply invalid configuration
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
      vars:
        storage_setup_volume_group_name: "{{ storage_setup_invalid_case.get('name', 'default') }}"
        storage_setup_physical_device: "{{ storage_setup_invalid_case.get('device', '/dev/something') }}"
  rescue:
    - name: require a validation failure
      ansible.builtin.assert:
        that:
          - >-
            ansible_failed_task.name == 'validate storage configuration' or
            ansible_failed_task.action == 'ansible.builtin.validate_argument_spec'

    - name: record expected input rejection
      ansible.builtin.set_fact:
        storage_setup_input_rejected: true

- name: require input rejection
  ansible.builtin.assert:
    that:
      - storage_setup_input_rejected
    fail_msg: "invalid input was accepted: {{ storage_setup_invalid_case }}"
