---
- name: converge
  hosts: all
  pre_tasks:
    - name: install systemd for role testing
      ansible.builtin.package:
        name: systemd
        state: present
  roles:
    - role: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
  post_tasks:
    - name: configure independent caller-owned volume groups
      ansible.builtin.copy:
        dest: "/etc/storage-setup.d/{{ item.filename }}"
        content: "{{ item.content }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - filename: 20-data.conf
          content: |
            [group:data]
            name = data
            devices = /dev/disk/by-id/example-data
            [volume:database]
            group = data
            volume = database
            size = 1g
        - filename: 30-logs.conf
          content: |
            [group:logs]
            name = logs
            devices = /dev/disk/by-id/example-logs
