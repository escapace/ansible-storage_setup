---
- name: verify
  hosts: all
  tasks:
    - name: validate installed unit and drop-ins
      ansible.builtin.command:
        argv:
          - systemd-analyze
          - verify
          - /usr/lib/systemd/system/storage-setup.service
      register: storage_setup_unit_verification
      changed_when: false

    - name: require warning-free unit validation
      ansible.builtin.assert:
        that:
          - storage_setup_unit_verification.stdout == ''
          - storage_setup_unit_verification.stderr == ''

    - name: reject non-block devices with the unit precondition
      ansible.builtin.command:
        argv: [/usr/bin/test, -b, "{{ item }}"]
      loop:
        - /dev/something
        - /etc/passwd
        - /dev/null
      register: storage_setup_nonblock_precondition
      changed_when: false
      failed_when: storage_setup_nonblock_precondition.rc != 1

    - name: read device dependencies
      ansible.builtin.slurp:
        src: /etc/systemd/system/storage-setup.service.d/10-devices.conf
      register: storage_setup_dependencies

    - name: verify required device and block-device precondition
      ansible.builtin.assert:
        that:
          - "'Requires=dev-something.device' in storage_setup_dependencies.content | b64decode"
          - "'After=dev-something.device' in storage_setup_dependencies.content | b64decode"
          - "'ExecStartPre=/usr/bin/test -b /dev/something' in storage_setup_dependencies.content | b64decode"

    - name: inspect installed script
      ansible.builtin.stat:
        path: /usr/bin/storage-setup
      register: storage_setup_script

    - name: inspect boot enablement
      ansible.builtin.stat:
        path: /etc/systemd/system/multi-user.target.wants/storage-setup.service
      register: storage_setup_enabled

    - name: read configured volume group
      ansible.builtin.slurp:
        src: /etc/filesystems.d/10-volume-group.conf
      register: storage_setup_config

    - name: verify persistent installation
      ansible.builtin.assert:
        that:
          - storage_setup_script.stat.mode == '0755'
          - storage_setup_script.stat.pw_name == 'root'
          - storage_setup_enabled.stat.islnk
          - storage_setup_enabled.stat.lnk_source == '/usr/lib/systemd/system/storage-setup.service'
          - "'[group:default]' in storage_setup_config.content | b64decode"
          - "'devices = /dev/something' in storage_setup_config.content | b64decode"

    - name: create caller-owned configuration
      ansible.builtin.copy:
        dest: /etc/filesystems.d/99-caller.conf
        content: "# caller-owned configuration\n"
        mode: "0644"

    - name: create caller-owned drop-in
      ansible.builtin.copy:
        dest: /etc/systemd/system/storage-setup.service.d/90-caller.conf
        content: "[Service]\nEnvironment=STORAGE_SETUP_CALLER_TEST=1\n"
        mode: "0644"

    - name: apply empty defaults
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"

    - name: inspect disabled configuration
      ansible.builtin.stat:
        path: /etc/filesystems.d/10-volume-group.conf
      register: storage_setup_disabled

    - name: inspect removed device dependencies
      ansible.builtin.stat:
        path: /etc/systemd/system/storage-setup.service.d/10-devices.conf
      register: storage_setup_disabled_dependencies

    - name: inspect caller-owned drop-in
      ansible.builtin.stat:
        path: /etc/systemd/system/storage-setup.service.d/90-caller.conf
      register: storage_setup_caller_dropin

    - name: inspect caller-owned configuration
      ansible.builtin.stat:
        path: /etc/filesystems.d/99-caller.conf
      register: storage_setup_caller

    - name: verify empty configuration transition
      ansible.builtin.assert:
        that:
          - not storage_setup_disabled.stat.exists
          - not storage_setup_disabled_dependencies.stat.exists
          - storage_setup_caller.stat.exists
          - storage_setup_caller_dropin.stat.exists

    - name: configure multiple devices and maximum length group name
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
      vars:
        storage_setup_volume_group_name: "{{ 'a' * 128 }}"
        storage_setup_physical_device: /dev/disk/by-id/example-one /dev/vdc

    - name: read multiple device configuration
      ansible.builtin.slurp:
        src: /etc/filesystems.d/10-volume-group.conf
      register: storage_setup_multiple

    - name: read multiple device dependencies
      ansible.builtin.slurp:
        src: /etc/systemd/system/storage-setup.service.d/10-devices.conf
      register: storage_setup_multiple_dependencies

    - name: validate unit with escaped device names
      ansible.builtin.command:
        argv:
          - systemd-analyze
          - verify
          - /usr/lib/systemd/system/storage-setup.service
      register: storage_setup_multiple_unit_verification
      changed_when: false

    - name: verify escaped device unit names
      ansible.builtin.assert:
        that:
          - storage_setup_multiple_unit_verification.stdout == ''
          - storage_setup_multiple_unit_verification.stderr == ''
          - >-
            'Requires=dev-disk-by\\x2did-example\\x2done.device dev-vdc.device'
            in storage_setup_multiple_dependencies.content | b64decode
          - >-
            'After=dev-disk-by\\x2did-example\\x2done.device dev-vdc.device'
            in storage_setup_multiple_dependencies.content | b64decode
          - "'ExecStartPre=/usr/bin/test -b /dev/disk/by-id/example-one' in storage_setup_multiple_dependencies.content | b64decode"
          - "'ExecStartPre=/usr/bin/test -b /dev/vdc' in storage_setup_multiple_dependencies.content | b64decode"

    - name: verify multiple device configuration
      ansible.builtin.assert:
        that:
          - "('name = ' ~ 'a' * 128) in storage_setup_multiple.content | b64decode"
          - "'devices = /dev/disk/by-id/example-one /dev/vdc' in storage_setup_multiple.content | b64decode"

    - name: verify invalid inputs
      ansible.builtin.include_tasks: tasks/invalid-input.yaml
      loop:
        - { name: "" }
        - { name: "." }
        - { name: ".." }
        - { name: "-data" }
        - { name: "{{ 'a' * 129 }}" }
        - { name: "data\n" }
        - { name: 123 }
        - { name: null }
        - { device: null }
        - { device: ["/dev/vdb"] }
        - { device: " " }
        - { device: "vdb" }
        - { device: "/dev/vdb;echo" }
        - { device: "/dev/../tmp/disk" }
        - { device: "/dev/./vdb" }
        - { device: "/dev/vdb\n" }
      loop_control:
        loop_var: storage_setup_invalid_case

    - name: restore scenario configuration
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
      vars:
        storage_setup_physical_device: /dev/something

    - name: remove caller-owned test files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/filesystems.d/99-caller.conf
        - /etc/systemd/system/storage-setup.service.d/90-caller.conf
