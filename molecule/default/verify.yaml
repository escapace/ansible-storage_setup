---
- name: verify
  hosts: all
  tasks:
    - name: validate installed unit
      ansible.builtin.command:
        argv: [systemd-analyze, verify, /usr/lib/systemd/system/storage-setup.service]
      register: storage_setup_unit_verification
      changed_when: false

    - name: require warning-free unit validation
      ansible.builtin.assert:
        that:
          - storage_setup_unit_verification.stdout == ''
          - storage_setup_unit_verification.stderr == ''

    - name: inspect installed script
      ansible.builtin.stat:
        path: /usr/bin/storage-setup
      register: storage_setup_script

    - name: inspect boot enablement
      ansible.builtin.stat:
        path: /etc/systemd/system/multi-user.target.wants/storage-setup.service
      register: storage_setup_enabled

    - name: inspect legacy role-owned paths
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/storage-setup.d/10-volume-group.conf
        - /etc/systemd/system/storage-setup.service.d/10-devices.conf
      register: storage_setup_legacy

    - name: verify install-only role
      ansible.builtin.assert:
        that:
          - storage_setup_script.stat.mode == '0755'
          - storage_setup_script.stat.pw_name == 'root'
          - storage_setup_enabled.stat.islnk
          - storage_setup_enabled.stat.lnk_source == '/usr/lib/systemd/system/storage-setup.service'
          - storage_setup_legacy.results | selectattr('stat.exists') | list | length == 0

    - name: validate caller-owned multiple group configuration without disks
      ansible.builtin.command:
        argv: [/usr/bin/storage-setup, --validate]
      register: storage_setup_validation
      changed_when: false

    - name: require no disk operations during validation
      ansible.builtin.assert:
        that:
          - storage_setup_validation.stderr == ''
          - "'READ:' not in storage_setup_validation.stdout"
          - "'EXEC:' not in storage_setup_validation.stdout"

    - name: create caller-owned drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/storage-setup.service.d
        state: directory
        mode: "0755"

    - name: create caller-owned drop-in
      ansible.builtin.copy:
        dest: /etc/systemd/system/storage-setup.service.d/90-caller.conf
        content: "[Service]\nEnvironment=STORAGE_SETUP_CALLER_TEST=1\n"
        mode: "0644"

    - name: snapshot caller-owned files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/storage-setup.d/20-data.conf
        - /etc/storage-setup.d/30-logs.conf
        - /etc/systemd/system/storage-setup.service.d/90-caller.conf
      register: storage_setup_before

    - name: reapply install-only role
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"

    - name: inspect preserved caller-owned files
      ansible.builtin.stat:
        path: "{{ item.item }}"
      loop: "{{ storage_setup_before.results }}"
      register: storage_setup_after

    - name: verify caller ownership is preserved
      ansible.builtin.assert:
        that:
          - item.stat.checksum == item.item.stat.checksum
          - item.stat.mtime == item.item.stat.mtime
      loop: "{{ storage_setup_after.results }}"

    - name: remove caller-owned test drop-in
      ansible.builtin.file:
        path: /etc/systemd/system/storage-setup.service.d/90-caller.conf
        state: absent
