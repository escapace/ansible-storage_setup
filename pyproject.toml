[project]
name = "ansible-storage-setup"
version = "0.0.0"
requires-python = ">=3.14,<3.15"

[dependency-groups]
dev = [
  "ansible==14.4.0",
  "ansible-lint==26.8.0; sys_platform == 'linux'",
  "docker==7.2.0",
  "molecule==26.8.0",
  "molecule-plugins[docker]==26.7.15",
  "netaddr==1.3.0",
  "passlib==1.7.4",
  "ruff==0.17.0",
  "segno==1.6.6",
  "ty==0.0.87",
]

[tool.ruff]
target-version = "py312"
include = [
  "files/*.py",
  "tests/*.py",
  "pyproject.toml"
]

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "ANN"
]

[tool.ruff.lint.flake8-annotations]
# The subprocess wrappers intentionally forward the complete stdlib call signature.
allow-star-arg-any = true

[tool.ty.environment]
python-version = "3.12"
python-platform = "linux"

[tool.ty.src]
include = [
  "files",
  "tests"
]

[tool.uv]
environments = [
  "sys_platform == 'darwin'",
  "sys_platform == 'linux'"
]
managed = true

[tool.uv.workspace]
members = []

[tool.setuptools]
py-modules = []
