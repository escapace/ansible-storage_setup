---
- name: validate supported platform
  ansible.builtin.assert:
    that:
      - ansible_facts.get("os_family") == "RedHat"
    fail_msg: storage_setup requires a red hat family host with systemd and gathered facts.

- name: observe systemd version
  ansible.builtin.command:
    argv: [systemctl, --version]
  register: storage_setup_systemd_version
  changed_when: false
  check_mode: false

- name: validate systemd version
  ansible.builtin.assert:
    that:
      - storage_setup_systemd_version.stdout_lines | length > 0
      - storage_setup_systemd_version.stdout_lines[0] is match('^systemd [0-9]+( |$)')
      - storage_setup_systemd_version.stdout_lines[0].split()[1] | int >= 235
    fail_msg: storage_setup requires systemd 235 or newer for its hardening directives.

- name: install storage setup
  ansible.builtin.import_tasks: install.yaml
