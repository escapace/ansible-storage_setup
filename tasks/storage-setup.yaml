---
- name: derive device unit names
  ansible.builtin.command:
    argv: "{{ ['systemd-escape', '--path', '--suffix=device'] + storage_setup_physical_device.split() }}"
  register: storage_setup_device_units
  changed_when: false
  check_mode: false
  when: storage_setup_physical_device | length > 0

- name: create storage setup drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/storage-setup.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: storage_setup_physical_device | length > 0

- name: require configured devices at service startup
  ansible.builtin.template:
    src: devices.conf.j2
    dest: /etc/systemd/system/storage-setup.service.d/10-devices.conf
    owner: root
    group: root
    mode: "0644"
  when: storage_setup_physical_device | length > 0
  notify: storage_setup daemon-reload

- name: remove disabled device dependencies
  ansible.builtin.file:
    path: /etc/systemd/system/storage-setup.service.d/10-devices.conf
    state: absent
  when: storage_setup_physical_device | length == 0
  notify: storage_setup daemon-reload

- name: configure volume group
  ansible.builtin.template:
    src: volume-group.conf.j2
    dest: /etc/storage-setup.d/10-volume-group.conf
    owner: root
    group: root
    mode: "0644"
  when: storage_setup_physical_device | length > 0

- name: remove disabled volume group configuration
  ansible.builtin.file:
    path: /etc/storage-setup.d/10-volume-group.conf
    state: absent
  when: storage_setup_physical_device | length == 0
