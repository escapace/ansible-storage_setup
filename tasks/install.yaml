---
- name: install storage setup packages
  ansible.builtin.package:
    name: [device-mapper-libs, xfsprogs, lvm2, python3, systemd-udev]
    state: present

- name: install partitioner script
  ansible.builtin.copy:
    src: storage-setup/storage-setup.py
    dest: /usr/bin/storage-setup
    owner: root
    group: root
    mode: "0755"

- name: install partitioner service
  ansible.builtin.copy:
    src: storage-setup.service
    dest: /usr/lib/systemd/system/storage-setup.service
    owner: root
    group: root
    mode: "0644"
  notify: storage_setup daemon-reload

- name: create directory for volume configs
  ansible.builtin.file:
    state: directory
    path: /etc/storage-setup.d
    owner: root
    group: root
    mode: "0755"

- name: enable storage setup at boot
  ansible.builtin.systemd_service:
    name: storage-setup.service
    enabled: true
