name: ci

on:
  pull_request:
    branches:
      - trunk
    paths-ignore:
      - README.md
      - LICENSE
  push:
    branches:
      - trunk
    paths-ignore:
      - README.md
      - LICENSE

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: latest
      - name: install locked python tools
        run: uv sync --locked
      - name: lint python
        run: uv run ruff check
      - name: check python formatting
        run: uv run ruff format --check
      - name: check python types
        run: uv run ty check --error-on-warning
      - name: test with the development interpreter
        run: uv run python -W error tests/storage-setup.py
      - name: execute container tests
        run: bash tests/run-docker.sh

  continuous-integration:
    permissions:
      contents: read
      packages: read
    uses: escapace/workflows/.github/workflows/ci-ansible-role.yaml@trunk
