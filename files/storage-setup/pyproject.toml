[project]
name = "storage-setup"
version = "0.0.0"
requires-python = ">=3.14,<3.15"

[dependency-groups]
dev = [
  "ruff==0.17.0",
  "ty==0.0.87",
]

[tool.ruff]
target-version = "py312"
include = [
  "*.py",
  "tests/*.py",
  "pyproject.toml"
]

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "ANN"
]

[tool.ty.environment]
python-version = "3.12"
python-platform = "linux"

[tool.ty.src]
include = [
  "storage-setup.py",
  "tests"
]

[tool.uv]
package = false

[tool.uv.workspace]
members = []
